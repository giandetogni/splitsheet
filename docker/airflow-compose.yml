# Minimal local Airflow. One container, SQLite metadata DB, SequentialExecutor.
#
# The executor is not a free choice here: Airflow validates it against the metadata
# backend and refuses LocalExecutor on SQLite, exiting 1 before the scheduler starts.
# SequentialExecutor is the one that pairs with SQLite, and one task at a time is what
# a monthly pipeline with max_active_runs=1 needs anyway.
#
# Cloud Composer is out of the MVP on cost, and the upstream reference compose file is
# ~300 lines of Postgres, Redis, CeleryExecutor, triggerer and flower -- none of which
# this project needs to demonstrate orchestration for a monthly pipeline with one active
# run. That is a documented trade-off, not a gap: the DAG is executor-agnostic, so
# moving to a real executor is a compose change and not a code change.
#
# The image is NOT pulled by the test suite. tests/unit/test_dag_spec.py asserts the
# graph without Airflow; `make airflow-up` is what a human runs to see the UI.
services:
  # Root exactly once, for exactly one thing. Docker creates the venv volume owned by
  # root, because the image has nothing at that path to take ownership from, while the
  # Airflow user is uid 50000 -- so `uv sync` into its own environment fails with EPERM.
  # This service fixes the owner and exits. It mounts the volume and nothing else: no
  # repo, no preserved slice, no metadata DB, so the one root process in this file can
  # reach exactly one directory. Ownership rather than wide permissions, and skipped
  # entirely once the volume already belongs to the right user.
  venv-init:
    image: apache/airflow:2.10.5-python3.12
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - if [ "$$(stat -c %u /opt/splitsheet/.venv)" != "50000" ]; then chown -R 50000:0 /opt/splitsheet/.venv; fi
    volumes:
      - venv-linux:/opt/splitsheet/.venv

  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    depends_on:
      venv-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # The DAG folder is the repo's, so what runs here is what is committed.
      AIRFLOW__CORE__DAGS_FOLDER: /opt/splitsheet/dags
      # Named explicitly rather than left to uv's default, so the environment uv builds
      # is the masked path below and not whatever `.venv` the bind happens to expose.
      UV_PROJECT_ENVIRONMENT: /opt/splitsheet/.venv
      # The preflight tasks read GCS. Points at the single mounted file below, so the
      # library never falls back to searching a gcloud config directory that is not there.
      GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
      # The credential file carries identity, not a default project: mounting it alone
      # leaves out the gcloud config the host resolves the project from, and
      # `storage.Client()` takes no project argument. Named here instead.
      GOOGLE_CLOUD_PROJECT: ss-de-944054e7
    volumes:
      - ../:/opt/splitsheet
      # The bind above carries the host's .venv into the container, and that venv is
      # macOS: Mach-O interpreters, darwin .so files and shebangs naming /Users paths.
      # This empty named volume masks it, so uv builds a Linux environment at the same
      # path. The host copy is neither read nor written from in here -- nothing in the
      # container can reach it, and `publish.py`'s DBT_BIN resolves to the Linux one
      # without the financial code needing to know a container exists.
      - venv-linux:/opt/splitsheet/.venv
      # raw/ is the one irreplaceable input. Read-only, always.
      - ${SPLITSHEET_DATA:-~/splitsheet-data}/raw:/opt/splitsheet-data/raw:ro
      # derived/ has to be writable: build_canonical_texts.py writes
      # canonical_match_texts.tsv.gz into --work-dir before uploading it. Mounted
      # separately rather than widening the parent, so raw/ stays read-only no matter
      # what derived/ needs. One mount for both is what made the two share a mode.
      - ${SPLITSHEET_DATA:-~/splitsheet-data}/derived:/opt/splitsheet-data/derived
      # Application Default Credentials, one file and read-only. Deliberately not the
      # whole ~/.config/gcloud: the container needs this credential and nothing else that
      # lives beside it, and it must never be able to rewrite the host's copy.
      - ${HOME}/.config/gcloud/application_default_credentials.json:/home/airflow/.config/gcloud/application_default_credentials.json:ro
      - airflow-db:/opt/airflow

volumes:
  airflow-db:
  # Deliberately anonymous of host path: it exists only inside Docker, so it cannot
  # alias the host's .venv even by accident.
  venv-linux:
