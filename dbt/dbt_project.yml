# SplitSheet dbt project — Phase 5A.
#
# WHAT IS IN THE WAREHOUSE AND WHY: the financial joins live here, in SQL, not in Python. The
# temporal ownership join, the validity classification and the quality rules are the parts a
# reviewer needs to be able to read and re-run, so they are models rather than scripts.
#
# DATA PROVENANCE, repeated in every source and model description because it matters more than
# any other property of this project:
#   ListenBrainz listens / MusicBrainz recordings -> REAL
#   rights holders / ownership splits / rate cards -> MODELED, generated from a versioned seed
#   any royalty amount -> illustrative modeled amount, never an observed industry payout
#
# NOT BUILT YET, on purpose: there is no payout model, no gold layer and no monetary arithmetic
# anywhere. Ownership temporal validity has to be proven first, which is what this phase does.
name: "splitsheet"
version: "1.0.0"
config-version: 2
profile: "splitsheet"

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Fail on the first error rather than building on top of a broken upstream model.
flags:
  send_anonymous_usage_stats: false
  require_explicit_package_overrides_for_builtin_materializations: true
  source_freshness_run_project_hooks: false

# Defaults so `dbt build` runs standalone. The publisher (src/payout/publish.py) overrides
# attribution_run_id and publication_status per publication, and tests/unit/test_payout_policy.py
# asserts that payout_policy_version here still equals the digest-sealed value in
# config/payout_policy.yml -- so the warehouse cannot drift from the policy it claims to apply.
# The defaults describe the CURRENT state of the warehouse: pub:v2 is the publication in force and
# the restated matches are what the financial gates read. That matters for more than tidiness -- with
# the old defaults (prior and new both pointing at pub:v1) the restatement tests passed VACUOUSLY,
# because the delta between a publication and itself is trivially consistent. A standalone
# `dbt build` now validates the real restatement.
#
# Re-publishing is safe: fct_royalty_attribution refuses a run id it already holds, so building with
# these defaults inserts nothing.
vars:
  payout_policy_version: "1.0.0+84b4b68a37c9"
  attribution_run_id: "attr:fb74b680430fa0b2"
  publication_status: "PUBLISHED"
  # Which match result the frozen financial gates read: v1 (the Phase 4B matcher) or the Phase 6
  # restated one. The gates themselves are identical for both, which is what makes the delta
  # attributable to normalization alone.
  matches_source: "restated"
  # Restatement identity. Defaults describe pub:v1 -> pub:v2 so the models parse standalone; the
  # publisher passes the real values.
  prior_publication_id: "pub:v1"
  new_publication_id: "pub:v2"
  prior_attribution_run_id: "attr:83c013596d1d3da3"
  restatement_run_id: "restate:6b3923771883e860"
  trigger_reason: "TRANSLITERATION_KOREAN_JAPANESE_TITLES"
  prior_normalization_version: "1.0.0+0bc0dd643e06"
  new_normalization_version: "1.1.0+b3253b155934"
  prior_scoring_version: "1.0.0+cb21f9704ff0"
  new_scoring_version: "1.0.0+cb21f9704ff0"
  payout_policy_version_expected: "1.0.0+84b4b68a37c9"
  prior_row_count: 5925913
  prior_portfolio_paid: "98284.22"

models:
  splitsheet:
    +materialized: view
    staging:
      +materialized: view
    intermediate:
      # Tables, not views: these are joined repeatedly by the quality models and by tests, and
      # re-scanning 38M listens per reference is the kind of cost that adds up quietly.
      +materialized: table
    dimensions:
      +materialized: table
    quality:
      +materialized: table
    finance:
      # Tables, not views: these carry money and are read by tests, the reconciliation and the
      # current-publication view. A view would re-derive every amount on each reference.
      +materialized: table

snapshots:
  splitsheet:
    +target_schema: splitsheet_dbt
