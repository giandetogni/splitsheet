# FROZEN MANIFEST — Phase 4B, closed 2026-08-04. Nothing listed here may change in Phase 5.
#
# WHY A SEPARATE FILE: the individual configs already carry their own digests, but a digest
# only proves a file is internally consistent. This manifest is the cross-file statement that
# the PUBLISHED result was produced by exactly these versions, and tests/unit/test_frozen.py
# fails if the live configs stop matching it. An accidental edit to a weight, a threshold or a
# normalization rule now breaks the suite instead of silently invalidating every metric in
# docs/schema_notes.md sections 17-21.
#
# WHAT IS FROZEN, in the words of the Phase 5A instruction: normalization_version,
# scoring_version, weights, thresholds, candidate generation, fallback decisions, calibration,
# validation.
#
# TO CHANGE ANYTHING HERE: it is a restatement, not an edit. That means a new version for the
# component, a re-publication under a new run id, a new validation strategy (the current
# validation partition is CONSUMED and cannot be reused for tuning), and a documented
# comparison against the frozen numbers below. See docs/restatement_candidates.md.

