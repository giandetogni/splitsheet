# RESTATEMENT COHORT REGISTRY — structured, versioned, and hashable.
#
# ==========================================================================================
# WHY THIS FILE EXISTS. A restatement's identity has to include WHICH RECORDS it touched, and
# the Phase 6 identifier did not: `restatement_run_id` was hashed from the versions alone, so
# two runs over completely different cohorts under the same versions collided on one id. That
# actually happened during Phase 6 -- the first (wrong) cohort of 1,377,862 listens and the
# published cohort of 982,322 both produced `restate:6b3923771883e860`.
#
# A cohort is therefore represented HERE as a structured predicate with a SHA-256 over its
# canonical form. Never as a prose description and never as a SQL string:
#
#   * prose is not comparable -- two different sentences can describe the same set, and one
#     sentence can be edited without changing what it selects;
#   * arbitrary SQL is not an identity either -- whitespace, aliases and formatting change the
#     text without changing the rows, and a semantically different query can look almost the
#     same. Hashing SQL would make identity depend on how the query was typed.
#
# The predicate below is a small, closed vocabulary that both the reprocessing code and the
# identity hash read from. Anything a human wants to say about the cohort goes in fields that
# are DELIBERATELY EXCLUDED from the hash: status, measured counts, notes.
# ==========================================================================================

cohort_config_version: "1.0.0"

# The vocabulary a predicate may use. A cohort naming anything outside it fails to load, so a
# new kind of selection has to be added here on purpose rather than smuggled in as free text.
predicate_schema:
  period_start: "date, inclusive"
  period_end: "date, EXCLUSIVE (half-open, like every interval in this project)"
  prior_failure_reasons: "list of failure_reason values in the PRIOR publication's match result; empty list means no restriction"
  string_fields_examined: "list of raw listen fields the script test is applied to"
  required_scripts_any: "list of script names; the listen qualifies if ANY of them appears"

cohorts:
  # ---------------------------------------------------------------------------------------
  # The cohort the Phase 6 restatement actually published.
  # ---------------------------------------------------------------------------------------
  - cohort_key: "partial-empty-hangul-kana"
    status: "PUBLISHED"
    predicate:
      period_start: "2026-06-01"
      period_end: "2026-07-01"
      prior_failure_reasons: ["NO_LOOKUP_KEY_PARTIAL", "NO_LOOKUP_KEY_EMPTY"]
      string_fields_examined: ["artist_name", "recording_name"]
      required_scripts_any: ["hangul", "kana"]
    # Excluded from the hash. Recorded because it is the evidence, not the identity.
    measured_listens: 982322
    measured_distinct_pairs: 147599
    # What this run actually wrote into fct_restatements, and under which identifier. The id is
    # the LEGACY one because that is what the published rows carry; it is not corrected here.
    mart_run_id: "restate:6b3923771883e860"
    rows_in_delta_mart: 4416901
    recorded_delta: "0.86"
    notes: >-
      exactly the definition frozen in config/restatement_trigger.yml. Every listen in scope was
      unmatched under pub:v1, so no v1 match can be lost.
    cohort_sha256: "cc9e4a61308b6f31a77fe31576fd4e81e3f380e0e6bab6609d30c8b3925705d5"

  # ---------------------------------------------------------------------------------------
  # The cohort that was built first and REJECTED before publication. Kept because a rejected
  # cohort is the only way to prove the identity actually distinguishes cohorts, and because
  # it is the evidence for a real property of the transliteration rule.
  # ---------------------------------------------------------------------------------------
  - cohort_key: "script-only-no-failure-reason-restriction"
    status: "REJECTED_BEFORE_PUBLICATION"
    predicate:
      period_start: "2026-06-01"
      period_end: "2026-07-01"
      prior_failure_reasons: []
      string_fields_examined: ["artist_name", "recording_name"]
      required_scripts_any: ["hangul", "kana"]
    measured_listens: 1377862
    measured_distinct_pairs: 204902
    notes: >-
      dropped the failure-reason half of the frozen predicate, pulling in 395,540 listens that
      already had a lookup key and costing 29,954 previously matched ones, because
      transliteration CHANGES existing keys for mixed Latin/CJK strings as well as adding new
      ones. Never published.
    cohort_sha256: "90eaec5b2be2c3dfa7a07de0a7541396a721da4d166cd17534adf02ee86794e3"

# ==========================================================================================
# HISTORICAL RUNS THAT ARE NOT COHORT RESTATEMENTS.
#
# The delta mart contains rows written before the canonical identity scheme existed. They
# cannot be deleted -- fct_restatements is append-only and deleting from it to tidy the mart
# would be exactly the edit this project refuses -- so they are DECLARED here instead.
#
# The point of declaring them is to remove an exception from a test. An invariant that reads
# "every run id must be explained, except this one" explains nothing; an invariant that reads
# "every run id must be explained" is only enforceable if every run id actually has an entry.
#
# Fields that were never recorded are left ABSENT, not invented. A rehearsal that compared a
# publication with itself had no cohort, no canonical inputs and no identity worth the name,
# and saying so is the entry's whole content.
# ==========================================================================================

legacy_runs:
  - restatement_run_id: "restate:pending"
    run_type: "LEGACY_REHEARSAL"
    is_legacy: true
    is_financially_effective: false
    # Measured in the mart, at the grain where a delta means something: one run.
    recorded_delta: "0.00"
    rows_in_delta_mart: 4416901
    canonical_inputs_available: false
    provenance: >-
      written by an early build of fct_restatements, before the restatement was published and
      before restatement identity was canonical. The dbt vars for the two sides of the delta
      resolved to the same attribution run, so the mart compared pub:v1 with itself and every
      delta is exactly 0.00 -- the vacuous-defaults rehearsal recorded in docs/schema_notes.md
      section 24.12. `restate:pending` was a placeholder literal, never an identity: it names no
      cohort, no period and no publication, which is the same defect the canonical scheme fixes.
      The rows are retained because the mart is append-only; they are financially inert.
